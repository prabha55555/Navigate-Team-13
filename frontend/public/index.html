<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E1630" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Navigate is an AI-powered assessment and adaptive learning platform for institutions: build assessments with AI, run them with proctoring, analyse results and give every learner a personal learning path."
    />
    <meta property="og:title" content="Navigate — AI assessment &amp; adaptive learning" />
    <meta
      property="og:description"
      content="Turn a syllabus into AI-generated, proctored assessments — and every result into a personal learning path."
    />
    <meta property="og:type" content="website" />

    <link rel="icon" href="%PUBLIC_URL%/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fraunces (display) + Plus Jakarta Sans (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..600&family=Plus+Jakarta+Sans:wght@400..700&display=swap"
    />

    <!-- Apply the saved colour mode before first paint (no light/dark flash). -->

    <script>(function(){try{var m=localStorage.getItem("nv-theme");var d=m==="dark"||((!m||m==="system")&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");document.documentElement.style.backgroundColor=d?"#0A1022":"#F6F5F1";}catch(e){}})();</script>

    <title>Navigate — AI assessment &amp; adaptive learning</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Navigate.</noscript>
    <div id="root"></div>
  </body>
</html>
