# Serves the React single-page app and forwards /api to the backend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Syllabus uploads are up to 10 MB; leave headroom for the multipart envelope.
    client_max_body_size 12m;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/x-javascript text/javascript application/xml image/svg+xml
               application/manifest+json;

    # Basic security headers (locations below add no headers, so these are inherited).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API -> backend. Docker's embedded DNS (127.0.0.11) is used with a variable so nginx
    # re-resolves "backend" and does not keep a stale IP after the backend container is recreated.
    # Outside Docker Compose, change the resolver and the host name below.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;   # no URI part: the original /api/... path is passed through

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI generation can take up to about a minute.
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Hashed build assets: cache for a year.
    location /static/ {
        expires 1y;
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated so users pick up new releases.
    location = /index.html {
        expires -1;   # sends "Cache-Control: no-cache"
    }

    # Single-page-app fallback: unknown paths are handled by the React router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
