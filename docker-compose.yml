# Navigate: MongoDB + API + web app.
#
#   cp backend/.env.example backend/.env      # then edit it (JWT_SECRET, GEMINI_API_KEY, ...)
#   docker compose up -d --build
#   docker compose exec backend npm run seed  # optional demo data
#   open http://localhost:8080
#
# In backend/.env set APP_URL=http://localhost:8080 and CORS_ORIGINS=http://localhost:8080
# (or your public https URL). MONGO_URI, NODE_ENV, PORT and TRUST_PROXY are set below.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Not published to the host: only the backend can reach it.
    # NOTE: no authentication is configured. Use a managed cluster (or enable auth) in production.

  backend:
    build:
      context: .                      # repo root: the image also needs ./ai_services
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/navigate
      TRUST_PROXY: "1"                # one proxy hop (the nginx in the frontend container)
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
